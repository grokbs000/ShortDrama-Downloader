[project]
name = "shortdrama-downloader"
version = "3.4.0"
description = "Generic short-drama downloader with Provider, Media Resolver, HLS, FFmpeg and queue architecture"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
  "playwright>=1.50,<2",
  "python-multipart>=0.0.9,<1",
]
